services:
  broker:
    image: eclipse-mosquitto:2
    container_name: sentinel-broker
    ports:
      - "1883:1883"   # MQTT (python services)
      - "9001:9001"   # MQTT over WebSocket (browser UI)
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
