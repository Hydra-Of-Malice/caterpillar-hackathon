# SIMULATED - fleet baseline for Isolation Forest training (C) and operator history:
# 4 operators x 2 machines x 2 shifts = 16 shifts of 8.5 h. No scripted operator injections, only natural
# variation between archetypes. Machine-vs-operator attribution: EX-09 carries a hydraulic fault (hyd_fault,
# gt actor "machine") from 2026-09-14 09:30 to 2026-09-15 12:00 local, i.e. across OP-1019 (Joe) and
# OP-1007 (Anita). Filter on gt_inject to exclude those windows from "normal" training data.
# Operators: OP-1042 Ravi (novice_improving, skill 0 = history), OP-1007 Anita (expert), OP-1019 Joe
# (intermediate), OP-1033 Lena (late_shift_degradation: more variable after 5 h).
