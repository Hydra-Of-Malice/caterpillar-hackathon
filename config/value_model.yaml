# CAT Sentinel — business value model assumptions (owned by sentinel/value, agent H).
# Every assumption has low / base / high, a unit, a tag, a source (URL or "assumption") and a note.
#   tag: ESTABLISHED   = published primary/official statistic
#        VENDOR_CLAIM  = OEM / vendor / trade-press claim (often "up to"; secondary)
#        ASSUMPTION    = team judgement, to be replaced by pilot data
#        INPUT         = user input, not an uncertainty (excluded from scenarios and sensitivity)
# "(snippet)" in a note = figure verified from search-result text only (page returned 403 / timed out).
# low/high are the numeric range; the model works out which end is conservative for value.
# Scenario "low" = every uncertain assumption at its conservative end at once (a corner, not a
# probability interval); "high" = every assumption at its optimistic end.
# Machine class: 20 t hydraulic excavator (Cat 320 class), US contractor, USD.
# ALL prototype metrics are SIMULATED. Customer ROI needs a pilot (docs/sections/16-business-value.md §6).

version: "value-model-1.0.0"
currency: USD
machine_class: "20 t hydraulic excavator (Cat 320 class)"
label: "ESTIMATE — assumptions editable; prototype metrics SIMULATED"

assumptions:
  # ------------------------------------------------------------------ fleet and usage
  fleet_size:
    low: 10
    base: 10
    high: 10
    unit: machines
    tag: INPUT
    source: assumption
    note: "Fleet size for fleet totals. The request can override it."
  operating_hours_per_year:
    low: 1200
    base: 1500
    high: 2000
    unit: engine h / machine / yr
    tag: ASSUMPTION
    source: assumption
    note: "SMU (engine-on) hours incl. idle. Contractor excavators typically 1,000-2,000 h; quarries run more."
  shift_engine_hours:
    low: 8
    base: 8
    high: 8
    unit: engine h / shift
    tag: INPUT
    source: assumption
    note: "Used only to express gains per shift."
  idle_share_baseline:
    low: 0.28
    base: 0.35
    high: 0.40
    unit: fraction of engine hours
    tag: ESTABLISHED
    source: "https://www.constructionequipment.com/sustainability/article/10757122/how-to-manage-engine-idling-for-efficiency"
    note: "Komatsu: 38% average idle over ~75,000 North American machines; Volvo: 28-30% on ~450-machine fleets; ~20% cited as a realistic target."
    min: 0
    max: 0.95
  production_m3_per_h:
    low: 110
    base: 150
    high: 190
    unit: loose m3 / productive h
    tag: ASSUMPTION
    source: assumption
    note: "Fleet-average truck-loading output of a 20 t excavator (about 1.0-1.3 m3 bucket, about 20 s cycles, job efficiency applied)."
  cycle_time_s:
    low: 18
    base: 20
    high: 24
    unit: s / cycle
    tag: ASSUMPTION
    source: assumption
    note: "Fleet-average truck-loading cycle. Used for the per-cycle-second unit value."

  # ------------------------------------------------------------------ cost rates
  operator_wage_loaded_per_h:
    low: 35
    base: 40
    high: 60
    unit: USD / h
    tag: ESTABLISHED
    source: "https://www.bls.gov/ooh/construction-and-extraction/construction-equipment-operators.htm"
    note: "BLS median for construction equipment operators $28.66/h (May 2025) times an assumed ~1.4 burden (taxes, insurance, benefits). High = union metro rates."
  machine_ownership_cost_per_h:
    low: 30
    base: 40
    high: 55
    unit: USD / engine h
    tag: ASSUMPTION
    source: assumption
    note: "Depreciation + interest + insurance. A new 20 t excavator at about $250-350k over 10,000-12,000 h. Cross-check against EquipmentWatch / USACE EP 1110-1-8 schedules in the pilot."
  machine_operating_cost_ex_fuel_per_h:
    low: 18
    base: 25
    high: 35
    unit: USD / working h
    tag: ASSUMPTION
    source: assumption
    note: "Maintenance, repairs, undercarriage, ground-engaging tools, lube. Excludes fuel."
  fuel_working_l_per_h:
    low: 11
    base: 15
    high: 20
    unit: L / working h
    tag: VENDOR_CLAIM
    source: "https://www.equipmentworld.com/maintenance/maintenance/article/14945250/oo-costs-excavators"
    note: "Equipment World / Komatsu (snippet): 20 t fuel $8.55-20.25/h at $4.50/gal, i.e. about 7-17 L/h light to heavy. Dealer pages quote 15-30 L/h for 320 GC. Base is mid-duty."
  fuel_price_per_l:
    low: 0.80
    base: 0.95
    high: 1.30
    unit: USD / L
    tag: ESTABLISHED
    source: "https://www.eia.gov/dnav/pet/pet_pri_gnd_a_epd2d_pte_dpgal_w.htm"
    note: "EIA US on-highway diesel averaged about $3.66/gal in 2025 (= $0.97/L). Off-road dyed diesel is cheaper (low); many non-US markets are higher (high)."
  idle_fuel_l_per_h:
    low: 2.5
    base: 3.5
    high: 4.5
    unit: L / idle h
    tag: VENDOR_CLAIM
    source: "https://www.forconstructionpros.com/business/business-services/coaching-consulting/blog/22578411/caterpillar-cat-save-a-gallon-an-hour-on-the-jobsite-by-reducing-idle-time"
    note: "Cat (snippet): most equipment burns about a gallon (3.8 L) an hour at idle. Dealers quote 3-5 L/h for excavators by size. Auto engine-speed control lowers the figure (low)."
  idle_hours_reduction_frac:
    low: 0.05
    base: 0.15
    high: 0.30
    unit: fraction of baseline idle hours eliminated
    tag: ASSUMPTION
    source: "https://www.constructionequipment.com/sustainability/article/10757122/how-to-manage-engine-idling-for-efficiency"
    note: "Only avoidable idle is targeted; waiting-for-truck idle is context-gated and not coached. Going from the 35-38% average to the ~20% target would cut idle hours by ~45%, so base 15% is about a third of that. Cat engine idle shutdown already exists; Sentinel adds context and coaching."
    min: 0
    max: 1
  idle_hour_smu_cost_per_h:
    low: 3
    base: 7
    high: 12
    unit: USD / idle engine h
    tag: ASSUMPTION
    source: "https://www.constructionequipment.com/sustainability/article/10757122/how-to-manage-engine-idling-for-efficiency"
    note: "Non-fuel cost of an idle hour: hour-based preventive maintenance, warranty hours used up while idling, lower residual value for higher-hour machines (qualitative in source). The $ figure is an assumption."
  time_value_realization_frac:
    low: 0.30
    base: 0.50
    high: 0.80
    unit: fraction
    tag: ASSUMPTION
    source: assumption
    note: "Share of ownership + labour cost of a freed productive hour that becomes real money (crew redeployed, job finished earlier, less overtime or rental). Variable costs (fuel, wear) are always counted in full."
    min: 0
    max: 1
  billed_rate_per_h:
    low: 150
    base: 170
    high: 220
    unit: USD / h (machine + operator)
    tag: ASSUMPTION
    source: assumption
    note: "Revenue proxy for the bid-risk term only. Web guides quote $150-250/h for a 20-30 t excavator with operator (unverified)."

  # ------------------------------------------------------------------ productivity lever (R3 Practice Analyser, T0 coaching)
  productivity_gap_frac:
    low: 0.08
    base: 0.12
    high: 0.20
    unit: fraction of expert output
    tag: VENDOR_CLAIM
    source: "https://www.toolgrit.com/guides/excavator-production-rates"
    note: "Fleet-average operator vs expert output gap. Secondary report of Caterpillar studies: operator skill alone gives a 10-15% spread in tons/h on the same machine. Novices are far worse (Volvo 80-operator study, forconstructionpros.com, page blocked) but the training lever covers them."
    min: 0
    max: 0.9
  gap_closure_frac:
    low: 0.10
    base: 0.20
    high: 0.35
    unit: fraction of gap closed in year 1
    tag: ASSUMPTION
    source: assumption
    note: "Share of the gap that coaching + targeted practice closes. No field evidence yet. This is the primary pilot KPI."
    min: 0
    max: 1

  # ------------------------------------------------------------------ training lever (R3)
  operators_per_machine:
    low: 1.0
    base: 1.2
    high: 1.5
    unit: operators / machine
    tag: ASSUMPTION
    source: assumption
    note: "Includes relief and second-shift operators."
  annual_operator_turnover_frac:
    low: 0.15
    base: 0.20
    high: 0.30
    unit: fraction / yr
    tag: ASSUMPTION
    source: "https://www.agc.org/sites/default/files/users/user21902/2025%20Workforce%20Survey%20Analysis%20(3).pdf"
    note: "Construction turnover is often quoted at 20-30%/yr (secondary, unverified). AGC 2025: 77% of firms find heavy-equipment operators hard to fill; 48% cite new hires who quit or fail to show."
    min: 0
    max: 1
  time_to_proficiency_months:
    low: 4
    base: 6
    high: 12
    unit: months
    tag: ASSUMPTION
    source: "https://www.bls.gov/ooh/construction-and-extraction/construction-equipment-operators.htm"
    note: "Time for a new operator to reach productive (not expert) output. BLS: apprenticeships run 3-4 years. Expert level is often quoted at 5-10 years."
  novice_productivity_deficit_frac:
    low: 0.20
    base: 0.30
    high: 0.40
    unit: fraction
    tag: ASSUMPTION
    source: assumption
    note: "Average output shortfall vs a proficient operator during the ramp-up."
    min: 0
    max: 0.9
  time_to_proficiency_reduction_frac:
    low: 0.05
    base: 0.15
    high: 0.29
    unit: fraction
    tag: ASSUMPTION
    source: "https://pubmed.ncbi.nlm.nih.gov/33630473/"
    note: "Faster ramp from gap-targeted training. Kept equal to training_effect.time_to_proficiency_reduction_frac below: base = PBP meta-analysis -15% procedure time, high = Seymour 2002 RCT 29% faster, low = small effect. Simulator vendors claim up to 40% less machine time (VENDOR_CLAIM)."
    min: 0
    max: 1
  instructor_hours_per_new_operator:
    low: 24
    base: 40
    high: 80
    unit: h
    tag: ASSUMPTION
    source: assumption
    note: "One-to-one instructor or mentor time per new operator."
  instructor_cost_per_h:
    low: 60
    base: 75
    high: 100
    unit: USD / h
    tag: ASSUMPTION
    source: assumption
    note: "Loaded cost of an instructor or senior operator acting as mentor."
  instructor_hours_reduction_frac:
    low: 0.10
    base: 0.20
    high: 0.30
    unit: fraction
    tag: ASSUMPTION
    source: assumption
    note: "The Practice Analyser pre-screens each session so the instructor coaches only the flagged phases."
    min: 0
    max: 1
  training_machine_hours_per_new_operator:
    low: 20
    base: 40
    high: 80
    unit: machine h
    tag: ASSUMPTION
    source: assumption
    note: "Production machine taken out of work for training."
  training_machine_hours_reduction_frac:
    low: 0.10
    base: 0.25
    high: 0.40
    unit: fraction
    tag: VENDOR_CLAIM
    source: "https://cm-labs.com/en/resource/11-benefits-of-training-with-simulators/"
    note: "Simulator vendor claim: up to 40% less real-equipment training time. High = that claim; base = well under it."
    min: 0
    max: 1

  # ------------------------------------------------------------------ safety lever (R2) — EXPECTED VALUE, not a promise
  workers_exposed_per_machine:
    low: 2
    base: 3
    high: 4
    unit: workers
    tag: ASSUMPTION
    source: assumption
    note: "Operator + ground crew / spotter + truck drivers working around the machine."
  recordable_rate_per_worker_year:
    low: 0.023
    base: 0.023
    high: 0.023
    unit: cases / FTE-yr
    tag: ESTABLISHED
    source: "https://www.bls.gov/iif/nonfatal-injuries-and-illnesses-tables/table-1-injury-and-illness-rates-by-industry-2023-national.htm"
    note: "BLS SOII 2023: construction had 2.3 recordable cases per 100 FTE (snippet)."
  machine_related_share_of_recordables:
    low: 0.08
    base: 0.12
    high: 0.20
    unit: fraction
    tag: ASSUMPTION
    source: "https://stopconstructionfalls.com/wp-content/uploads/2026/03/Liberty-Mutual_Construction-Workplace-Safety-Index-1.pdf"
    note: "Share of recordables involving the machine (struck-by, caught-between, ingress/egress). Anchor: Liberty Mutual WSI Construction, struck-by = 12.2% of construction injury costs (snippet)."
    min: 0
    max: 1
  fatality_rate_per_worker_year:
    low: 0.000096
    base: 0.000096
    high: 0.000096
    unit: deaths / FTE-yr
    tag: ESTABLISHED
    source: "https://www.bls.gov/news.release/cfoi.nr0.htm"
    note: "BLS CFOI 2023: construction fatal rate 9.6 per 100,000 FTE (1,075 deaths) (snippet)."
  machine_related_share_of_fatalities:
    low: 0.10
    base: 0.15
    high: 0.25
    unit: fraction
    tag: ESTABLISHED
    source: "https://www.cdc.gov/niosh/bulletin/2023/struck-by-stand-down.html"
    note: "NIOSH: 150 struck-by construction deaths in 2020, about 15% of about 1,000 construction deaths that year. Not all involve excavators (low)."
    min: 0
    max: 1
  cost_per_recordable_injury:
    low: 30000
    base: 48000
    high: 80000
    unit: USD / case
    tag: ESTABLISHED
    source: "https://injuryfacts.nsc.org/work/costs/work-injury-costs/"
    note: "NSC Injury Facts: $48,000 per medically consulted work injury (2024; $43,000 in 2023) (snippet). High adds uninsured indirect costs; OSHA puts indirect costs at 1.1-4.5x direct (https://www.osha.gov/safetypays/background)."
  cost_per_fatality:
    low: 1460000
    base: 1540000
    high: 2500000
    unit: USD / death
    tag: ESTABLISHED
    source: "https://injuryfacts.nsc.org/work/costs/work-injury-costs/"
    note: "NSC economic cost per work death: $1.54M (2024), $1.46M (2023) (snippet). This is not a value of statistical life. High adds litigation and stoppage (assumption)."
  property_damage_incidents_per_machine_year:
    low: 0.05
    base: 0.10
    high: 0.20
    unit: incidents / machine-yr
    tag: ASSUMPTION
    source: "https://en.wikipedia.org/wiki/Accident_triangle"
    note: "Truck, structure or utility contacts. Bird (1969): 1 serious : 10 minor : 30 property-damage : 600 near-miss, so property-damage events outnumber injuries. The ratio is contested and used only as a sanity check."
  cost_per_property_damage_incident:
    low: 3000
    base: 8000
    high: 20000
    unit: USD / incident
    tag: ASSUMPTION
    source: assumption
    note: "Repair + downtime + investigation."
  high_risk_events_per_100h:
    low: 2
    base: 5
    high: 10
    unit: DANGER/WARNING events / 100 engine h
    tag: ASSUMPTION
    source: assumption
    note: "Baseline precursor events (belt off while moving, person in zone, fast swing near truck). The demo rates are SIMULATED; the pilot measures the real baseline."
  precursor_event_reduction_frac:
    low: 0.10
    base: 0.25
    high: 0.40
    unit: fraction
    tag: ASSUMPTION
    source: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7217447/"
    note: "Fewer precursor events after coaching + targeted training. Analogue only: proficiency-based simulation training cut excavation utility strikes 35-61% in a randomized study. Sentinel's Shift-2 reduction is SIMULATED."
    min: 0
    max: 1
  precursor_risk_attribution_frac:
    low: 0.25
    base: 0.40
    high: 0.60
    unit: fraction
    tag: ASSUMPTION
    source: assumption
    note: "Share of machine-related incident risk that runs through the observed precursor behaviours. Incident reduction = event reduction x attribution."
    min: 0
    max: 1

  # ------------------------------------------------------------------ wear lever (R4 unusual behaviour) — WEAK EVIDENCE
  operator_sensitive_maintenance_share:
    low: 0.20
    base: 0.30
    high: 0.40
    unit: fraction of non-fuel operating cost
    tag: ASSUMPTION
    source: "https://www.forconstructionpros.com/equipment/fleet-maintenance/undercarriage/article/21171941/operators-drive-steel-track-undercarriage-costs"
    note: "Undercarriage, GET, hydraulic hoses and pins driven by technique. Trade press: operators drive undercarriage cost, which can be up to about 50% of tracked-machine maintenance (secondary)."
    min: 0
    max: 1
  wear_reduction_frac:
    low: 0.02
    base: 0.05
    high: 0.10
    unit: fraction
    tag: ASSUMPTION
    source: "https://www.cat.com/en_US/products/new/technology/productivity/productivity/123420.html"
    note: "Cat Operator Coaching ships 'Machine Health' tips, so Cat treats technique as a wear driver, but no public % was found. Weakest lever; excluded from the pitch headline."
    min: 0
    max: 1

  # ------------------------------------------------------------------ planning lever (R1 + R5)
  haul_trucks_per_excavator:
    low: 1
    base: 2
    high: 3
    unit: trucks
    tag: ASSUMPTION
    source: assumption
    note: "Trucks loaded by one excavator."
  truck_wait_hours_per_machine_year:
    low: 50
    base: 100
    high: 200
    unit: truck h / machine-yr
    tag: ASSUMPTION
    source: assumption
    note: "Truck hours lost to excavator/truck mismatch or late task changes."
  haul_truck_cost_per_h:
    low: 70
    base: 90
    high: 130
    unit: USD / h incl. driver
    tag: ASSUMPTION
    source: assumption
    note: "Owned or rented articulated/on-road truck with driver."
  truck_wait_reduction_frac:
    low: 0.05
    base: 0.10
    high: 0.20
    unit: fraction
    tag: ASSUMPTION
    source: assumption
    note: "From calibrated P10/P50/P90 task-time and live remaining-time estimates."
    min: 0
    max: 1
  bid_risk_reduction_frac_of_revenue:
    low: 0.0
    base: 0.001
    high: 0.005
    unit: fraction of machine revenue
    tag: ASSUMPTION
    source: assumption
    note: "Smaller contingency or overrun from better duration estimates. Low = 0 (not cash until proven)."
    min: 0
    max: 0.05

  # ------------------------------------------------------------------ commercial
  subscription_per_machine_per_year:
    low: 600
    base: 1200
    high: 2400
    unit: USD / machine / yr
    tag: ASSUMPTION
    source: assumption
    note: "Hypothetical Sentinel price (about $100/machine/month base). Not a Cat price."
  one_off_per_machine:
    low: 500
    base: 1500
    high: 3000
    unit: USD / machine
    tag: ASSUMPTION
    source: assumption
    note: "Install, integration and onboarding. Excludes proximity hardware (assumes Cat Detect-class hardware is already fitted)."
  co2_kg_per_l_diesel:
    low: 2.68
    base: 2.68
    high: 2.68
    unit: kg CO2 / L
    tag: ESTABLISHED
    source: "https://www.epa.gov/greenvehicles/greenhouse-gas-emissions-typical-passenger-vehicle"
    note: "EPA: 10,180 g CO2 per gallon of diesel = 2.69 kg/L (factor not re-fetched this session). Reported as a gain; not monetised."

  # ------------------------------------------------------------------ practice analyser view
  practice_gap_closure_frac:
    low: 0.10
    base: 0.25
    high: 0.50
    unit: fraction of trainee gap closed
    tag: ASSUMPTION
    source: assumption
    note: "Individual trainee closing part of their Practice Analyser gap to the Expert Motion Model."
    min: 0
    max: 1
  expert_production_m3_per_h:
    low: 150
    base: 180
    high: 220
    unit: loose m3 / productive h
    tag: ASSUMPTION
    source: assumption
    note: "Fallback expert output when a PracticeReport gives only cycle times."

# ------------------------------------------------------------------ training effect (for the practice cohort simulation)
# Evidence that targeted feedback / proficiency-based simulator training speeds up motor-skill
# acquisition. No study was found that measures this for Cat excavator operators in the field, so
# the values below come from surgery (strong RCT/meta-analysis evidence), utility excavation (a small
# RCT) and excavator simulators (transfer only). learning_rate_multiplier = 1 / (1 - time_to_proficiency_reduction).
training_effect:
  version: "training-effect-1.0.0"
  tag: ASSUMPTION
  time_to_proficiency_reduction_frac:
    low: 0.05
    base: 0.15
    high: 0.29
    unit: fraction of practice time to reach the proficient band
  learning_rate_multiplier:
    low: 1.05
    base: 1.18
    high: 1.41
    unit: x skill gain per practice hour vs untargeted practice
  error_reduction_frac:
    low: 0.20
    base: 0.33
    high: 0.60
    unit: fraction fewer critical errors vs conventional training
  sources:
    - {claim: "VR training to expert criterion: dissection 29% faster, 6x fewer errors (RCT, n=16)", url: "https://pubmed.ncbi.nlm.nih.gov/12368674/", tag: ESTABLISHED}
    - {claim: "Proficiency-based progression meta-analysis: -60% intra-op errors, -15% procedure time vs standard training", url: "https://pubmed.ncbi.nlm.nih.gov/33630473/", tag: ESTABLISHED}
    - {claim: "Technology-enhanced simulation vs no intervention: pooled effect ~1.1 SD on skills, 0.5 SD on patient outcomes", url: "https://jamanetwork.com/journals/jama/article-abstract/1104300", tag: ESTABLISHED}
    - {claim: "PBP training for utility excavation crews: -33% critical errors (RCT, n=12); utility strikes -35% to -61% after rollout", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7217447/", tag: ESTABLISHED}
    - {claim: "Excavator simulator-trained group matched the real-machine group after ~10 h on the real excavator (transfer)", url: "https://ascelibrary.org/doi/10.1061/9780784479827.196", tag: ESTABLISHED}
    - {claim: "Simulators cut real-equipment training time by up to 40%", url: "https://cm-labs.com/en/resource/11-benefits-of-training-with-simulators/", tag: VENDOR_CLAIM}
  note: "Base = the meta-analytic procedural-time gain (15%); high = the single-RCT figure (29%); low = small effect. Transfer from surgery to excavators is an assumption. Cohort results are SIMULATED."
